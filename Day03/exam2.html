<!DOCTYPE html>
<html lang='en'>
<head>

</head>

<body>

    <h3> 입력 마크업 </h3>
    <from> <!--★★★★★ 여러개 입력 마크업들을 그룹 해주는 역할. 추후에 백엔드 통신  ★★★★★-->
            텍스트 : <input type="text" value="유재석"  disabled />                                       <br/>  <!--disabled=> 사용중지-->
            텍스트 : <input type="text" placeholder="아이디 입력하세요" readonly/>            <br/>  <!--readonly=> 읽기만 가능-->
            패스워드 : <input type="password" />                          <br/>
            첨부파일 : <input type="file" />                                     <br/>
            숫자 : <input type="number" />                                    <br/>
            날짜 : <input type="date" />                                          <br/>
            시간 : <input type="time" />                                          <br/>
            날짜/시간 : <input type="datetime-local" />                 <br/>
            스크롤 : <input type="range" />                                    <br/>
            체크박스(단일선택) : <input type="radio" name="동의여부" />  예   
                                              <input type="radio" name="동의여부" />  아니오                <br/>

            체크박스(복수선택) : <input type="checkbox" />  뉴스
                                              <input type="checkbox" />  SNS                                          <br/>
            전송버튼 : <input type="submit" value="전송버튼"/>                                          <br/>
            리셋버튼 : <input type="reset" value="리셋버튼"/>                                              <br/>
            일반버튼1 : <input type="button" value="일반버튼1"/>                                         <br/>
            일반버튼2 : <button type="button"> 일반버튼2 </button>                                    <br/>
            긴텍스트 : <textarea cols="30" rows="5"></textarea>                                            <br/>
            목록상자 : <select>
                                <option> 김밥 </option> 
                                <option> 피자 </option> 
                                <option> 치킨 </option>
                            </select>                                                                                                  <br/>




    </from>



</body>

</html>
